# Ogni mezz'ora scarica gli open data del Centro Maree di Venezia e pubblica maree.json nel ramo "dati".
# Il ramo viene riscritto ogni volta con un solo commit, così la cronologia del sito resta pulita.
name: Dati marea
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/maree.py', '.github/workflows/maree.yml']
permissions:
  contents: write
concurrency:
  group: maree
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dati precedenti
        run: |
          mkdir -p out
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/dati/maree.json" -o prec.json || echo '{}' > prec.json
      - name: Prepara maree.json
        run: python3 tools/maree.py out/maree.json --prec prec.json
      - name: Pubblica nel ramo dati
        run: |
          cd out
          git init -q -b dati
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maree.json
          git commit -q -m "Dati marea $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati
